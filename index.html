<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health Score</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <div class="card form-container">
      <div class="header">
        <h1>Mental Health Analytics</h1>
        <p>Provide your daily habits and demographic information for an instant assessment.</p>
      </div>
      
      <form id="prediction-form" class="form-grid">
        <div class="input-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" value="20" min="10" max="100" required>
        </div>

        <div class="input-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="input-group">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" value="USA" required>
        </div>

        <div class="input-group">
          <label for="academic_level">Academic Level</label>
          <select id="academic_level" name="academic_level">
            <option value="High School">High School</option>
            <option value="Undergraduate" selected>Undergraduate</option>
            <option value="Graduate">Graduate</option>
          </select>
        </div>

        <div class="input-group">
          <label for="most_used_platform">Top Platform</label>
          <select id="most_used_platform" name="most_used_platform">
            <option value="Facebook">Facebook</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="Instagram" selected>Instagram</option>
            <option value="Snapchat">Snapchat</option>
            <option value="Twitter">Twitter</option>
            <option value="YouTube">YouTube</option>
            <option value="TikTok">TikTok</option>
            <option value="LINE">LINE</option>
            <option value="KakaoTalk">KakaoTalk</option>
            <option value="VKontakte">VKontakte</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="WeChat">WeChat</option>
          </select>
        </div>

        <div class="input-group">
          <label for="purpose_of_use">Main Purpose</label>
          <select id="purpose_of_use" name="purpose_of_use">
            <option value="Networking">Networking</option>
            <option value="Education">Education</option>
            <option value="Entertainment" selected>Entertainment</option>
            <option value="News">News</option>
          </select>
        </div>

        <div class="input-group">
          <label for="avg_daily_usage_hours">Screen Time (hrs)</label>
          <input type="number" id="avg_daily_usage_hours" name="avg_daily_usage_hours" value="3" min="0" max="24" step="0.1" required>
        </div>

        <div class="input-group">
          <label for="daily_unlocks">Phone Unlocks</label>
          <input type="number" id="daily_unlocks" name="daily_unlocks" value="50" min="0" required>
        </div>

        <div class="input-group">
          <label for="study_hours">Study (hrs)</label>
          <input type="number" id="study_hours" name="study_hours" value="4" min="0" max="24" step="0.1" required>
        </div>

        <div class="input-group">
          <label for="physical_activity_hours">Exercise (hrs)</label>
          <input type="number" id="physical_activity_hours" name="physical_activity_hours" value="1" min="0" max="24" step="0.1" required>
        </div>

        <div class="input-group">
          <label for="sleep_hours_per_night">Sleep (hrs)</label>
          <input type="number" id="sleep_hours_per_night" name="sleep_hours_per_night" value="7" min="0" max="24" step="0.1" required>
        </div>

        <div class="input-group">
          <label for="stress_level">Stress Level</label>
          <select id="stress_level" name="stress_level">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Very High">Very High</option>
          </select>
        </div>

        <div class="action-row">
          <button type="submit" id="submit-btn">Calculate Score</button>
        </div>
      </form>
    </div>

    <div class="card result-container" id="result-pane">
      <div class="empty-state" id="empty-state">
        <div class="icon-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        </div>
        <p>Fill out the form and submit to see your score.</p>
      </div>

      <div class="score-wrapper fade-in" id="score-state" style="display: none;">
        <h2>Your Wellness Score</h2>
        <div class="score-circle">
          <span class="score-number" id="score-display">0</span>
        </div>
        <p class="score-context">Based on your daily digital behavior and lifestyle factors.</p>
      </div>

      <div class="error fade-in" id="error-state" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <p id="error-message">Something went wrong.</p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
